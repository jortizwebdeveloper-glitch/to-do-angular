<section class="flex h-screen">
  <div class="flex flex-col gap-5 py-5 px-6 w-1 grow">
    <div class="text-3xl font-semibold -mb-2">
      <h1>Todas las tareas</h1>
    </div>
    <div class="flex gap-5 justify-between">
      <app-input-search (valueChange)="onChangeSearch($event)" [value]="search() ?? ''"></app-input-search>
      @if (fecha() !== 'finalizadas') {
        <app-tabs
          [items]="statusList"
          [value]="estado()"
          (valueChange)="onChangeStatus($event)"
          class="ml-auto"
        ></app-tabs>
      }
    </div>
    <div class="flex flex-col gap-4 overflow-auto h-1 grow p-4 -m-4">
      @for (item of tasks(); track `card-${$index}-${item.id}`) {
        <app-card [data]="item" (eventStatusChenge)="onUpdateStatus($event, item)"></app-card>
      } @empty {
        <div class="flex flex-col gap-2 px-4 py-3 bg-white dark:bg-slate-900 rounded-xl shadow-md">
          <h4 class="text-xl font-semibold">Nada por aquí... 🔍</h4>
          <p class="leading-relaxed">
            No hay tareas registrados que coincidan con tu búsqueda actual. Intenta cambiar los
            filtros o crear una tarea nueva.
          </p>
        </div>
      }
    </div>
  </div>
  <router-outlet></router-outlet>
</section>
