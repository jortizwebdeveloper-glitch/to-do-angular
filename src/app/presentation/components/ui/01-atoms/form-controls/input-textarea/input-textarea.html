@let $invalid = touched() && invalid();
<app-input-label [label]="label()" [invalid]="$invalid" [errors]="errors()">
  <textarea
    rows="8"
    class="px-4 py-1.5 w-full min-h-40 max-h-80"
    [placeholder]="placeholder()"
    [name]="name()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
</app-input-label>
