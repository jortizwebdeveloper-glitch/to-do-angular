@let $invalid = touched() && invalid();
<app-input-label [label]="label()" [invalid]="$invalid" [errors]="errors()">
  <ul class="flex flex-wrap gap-5 px-4 py-4">
    @for (option of options(); track $index) {
      @let $id = `${ngName()}-${option.value}-${$index}`;
      <li>
        <label class="flex gap-2.5 rounded-xs cursor-pointer" [for]="$id">
          <input
            class="sr-only"
            [id]="$id"
            [name]="$id"
            type="checkbox"
            (change)="onBlur()"
            (input)="onInput($event, option.value)"
            [value]="option.value"
            [checked]="value()?.some((v) => option.value === v)"
          />
          <span
            class="ng-checkbox mt-1 bg-black/5 shadow-inner border border-black/10 dark:border-white/10 dark:bg-white/20"
            aria-hidden="true"
          >
          </span>
          {{ option.label }}
        </label>
      </li>
    }
  </ul>
</app-input-label>
