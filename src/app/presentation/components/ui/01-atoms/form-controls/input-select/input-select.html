@let $invalid = touched() && invalid();
<app-input-label
  (change)="onInput($event)"
  [label]="label()"
  [invalid]="$invalid"
  [errors]="errors()"
>
  <select class="px-4 py-1.5 w-full" [name]="name()" [value]="value()" (blur)="onBlur()">
    @for (option of options(); track $index) {
      <option
        class="text-white"
        [disabled]="!option.value"
        [value]="option.value"
        [selected]="option.value === value()"
      >
        {{ option.label }}
      </option>
    }
  </select>
</app-input-label>
