@let $invalid = touched() && invalid();
<app-input-label [label]="label()" [invalid]="$invalid" [errors]="errors()">
  <input
    type="text"
    class="px-4 py-1.5 w-full rounded-lg"
    [placeholder]="placeholder()"
    [id]="ngName()"
    [name]="ngName()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</app-input-label>
