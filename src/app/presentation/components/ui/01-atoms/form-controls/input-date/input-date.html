@let $invalid = touched() && invalid();
<app-input-label [label]="label()" [invalid]="$invalid" [errors]="errors()">
  <input
    type="date"
    class="px-4 py-1.5 w-full"
    [placeholder]="placeholder()"
    [name]="name()"
    [value]="visibleValue()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</app-input-label>
